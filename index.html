<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise</title>
<style>
:root{
  --bg1:#f7f7fb;--bg2:#e9ebf5;--text:#171923;--muted:#6b7280;
  --accent:#6c63ff;--accent2:#8b5cf6;--gold:#ffd76a;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);
  background:
    radial-gradient(circle at 20% 15%,rgba(108,99,255,.14),transparent 28%),
    radial-gradient(circle at 80% 85%,rgba(139,92,246,.12),transparent 25%),
    linear-gradient(145deg,var(--bg1),var(--bg2));
}
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.ambient:before,.ambient:after{
  content:"";position:absolute;width:280px;height:280px;border-radius:50%;filter:blur(60px);opacity:.35
}
.ambient:before{top:-100px;left:-80px;background:#a78bfa}
.ambient:after{right:-90px;bottom:-110px;background:#818cf8}
.scene{position:relative;width:min(92vw,430px);min-height:520px;display:grid;place-items:center}
.card{
  position:relative;width:100%;min-height:500px;padding:42px 28px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;
  border:1px solid rgba(255,255,255,.65);border-radius:30px;background:rgba(255,255,255,.78);
  box-shadow:0 22px 70px rgba(33,36,68,.14);backdrop-filter:blur(18px)
}
.eyebrow{margin-bottom:12px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:clamp(28px,7vw,38px);line-height:1.05;letter-spacing:-.04em}
.subtitle{max-width:290px;margin:14px 0 26px;color:var(--muted);font-size:15px;line-height:1.6}
.stage{position:relative;width:240px;height:220px;margin:8px 0 18px;display:grid;place-items:end center;perspective:900px}
.gift{position:relative;width:150px;height:130px;transform:translateY(6px)}
.gift-body{
  position:absolute;left:0;right:0;bottom:0;height:104px;border-radius:12px 12px 18px 18px;
  background:linear-gradient(135deg,#756df5,#5c4fe6);box-shadow:0 16px 24px rgba(92,79,230,.25),inset 0 1px 0 rgba(255,255,255,.2)
}
.gift-body:before{
  content:"";position:absolute;top:0;bottom:0;left:50%;width:26px;transform:translateX(-50%);
  background:linear-gradient(90deg,var(--gold),#ffbf3f,var(--gold))
}
.gift-lid{
  position:absolute;z-index:3;left:-7px;top:9px;width:164px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#8178ff,#6657eb);box-shadow:0 10px 18px rgba(92,79,230,.28);
  transform-origin:22% 90%;transition:transform 1s cubic-bezier(.2,.8,.2,1),top 1s cubic-bezier(.2,.8,.2,1)
}
.gift-lid:before{
  content:"";position:absolute;left:50%;top:-2px;width:26px;height:40px;transform:translateX(-50%);
  background:linear-gradient(90deg,var(--gold),#ffbf3f,var(--gold))
}
.bow{position:absolute;z-index:4;top:-25px;left:50%;width:62px;height:35px;transform:translateX(-50%);transition:transform 1s cubic-bezier(.16,1,.3,1)}
.bow:before,.bow:after{
  content:"";position:absolute;top:7px;width:31px;height:24px;border:8px solid var(--gold);background:transparent
}
.bow:before{left:0;border-radius:90% 25% 70% 25%;transform:rotate(18deg)}
.bow:after{right:0;border-radius:25% 90% 25% 70%;transform:rotate(-18deg)}
.bow-knot{
  position:absolute;z-index:5;left:50%;top:12px;width:19px;height:19px;transform:translateX(-50%);
  border-radius:50%;background:#ffbf3f
}
.tag{
  position:absolute;z-index:6;right:14px;top:48px;padding:5px 7px;border-radius:5px;
  background:rgba(255,255,255,.88);color:#5c4fe6;font-size:9px;font-weight:800;letter-spacing:.08em;transform:rotate(6deg)
}
.message{
  position:absolute;z-index:5;width:230px;padding:25px 20px 22px;border-radius:18px;
  background:rgba(255,255,255,.96);box-shadow:0 16px 36px rgba(32,36,65,.18);
  border:1px solid rgba(108,99,255,.12);transform:translateY(48px) scale(.82);opacity:0;
  pointer-events:none;transition:transform 1.05s cubic-bezier(.16,1,.3,1),opacity .55s ease .18s
}
.message-icon{
  width:42px;height:42px;margin:0 auto 11px;display:grid;place-items:center;border-radius:50%;
  background:linear-gradient(135deg,#eeeaff,#f6f2ff);font-size:21px
}
.message h2{margin:0 0 7px;font-size:22px;letter-spacing:-.03em}
.message p{margin:0;color:#646b78;line-height:1.55;font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.start{
  border:0;padding:14px 28px;min-width:150px;border-radius:999px;font:inherit;font-weight:750;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 24px rgba(108,99,255,.3);
  cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,opacity .25s ease
}
.start:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(108,99,255,.36)}
.start:active{transform:translateY(0)}
.start:focus-visible{outline:3px solid rgba(108,99,255,.25);outline-offset:4px}
.hint{margin-top:15px;color:#8a8f9c;font-size:12px}
.scene.open .gift-lid{top:-54px;transform:rotate(-18deg) translateX(-7px)}
.scene.open .bow{transform:translateX(-50%) translateY(-64px) rotate(-18deg)}
.scene.open .message{opacity:1;transform:translateY(-95px) scale(1);pointer-events:auto;transition-delay:.38s}
.scene.open .start{opacity:0;transform:translateY(8px) scale(.96);pointer-events:none}
.scene.open .subtitle,.scene.open h1,.scene.open .eyebrow{opacity:0;transform:translateY(-8px)}
.eyebrow,h1,.subtitle{transition:opacity .35s ease,transform .45s ease}
.spark{position:absolute;z-index:7;width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:0}
.s1{left:58px;top:86px}.s2{left:176px;top:92px}.s3{left:91px;top:122px;width:5px;height:5px}.s4{left:155px;top:125px;width:5px;height:5px}
.scene.open .s1{animation:sparkle 1.15s ease-out .15s forwards;--dx:-30px;--dy:-52px}
.scene.open .s2{animation:sparkle 1.2s ease-out .22s forwards;--dx:35px;--dy:-55px}
.scene.open .s3{animation:sparkle 1s ease-out .3s forwards;--dx:-18px;--dy:-72px}
.scene.open .s4{animation:sparkle 1.05s ease-out .35s forwards;--dx:20px;--dy:-76px}
@keyframes sparkle{
  0%{opacity:0;transform:translate(0,0) scale(.2) rotate(0)}25%{opacity:1}
  75%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(90deg)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="ambient"></div>
<main class="scene" id="scene">
  <section class="card">
    <div class="eyebrow">A little surprise</div>
    <h1>Something is waiting for you</h1>
    <p class="subtitle">There’s just one way to find out what’s inside.</p>

    <div class="stage" aria-hidden="true">
      <div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div><div class="spark s4"></div>
      <div class="message">
        <div class="message-icon">✨</div>
        <h2 id="messageTitle">Surprise!</h2>
        <p id="messageText"> If you want A beautiful gift Like ₹500 than Sing A beautiful song and record it  and send with the same email. I glad To hear your voice </p>
      </div>

      <div class="gift">
        <div class="bow"><div class="bow-knot"></div></div>
        <div class="gift-lid"></div>
        <div class="gift-body"></div>
        <div class="tag">OPEN</div>
      </div>
    </div>

    <button class="start" id="startBtn">Start</button>
    <div class="hint" id="hint">Tap once to open your  Wonderful surprise</div>
  </section>
</main>

<script>
  const params = new URLSearchParams(window.location.search);
  const message = params.get("message");
  const title = params.get("title");

  if (message) document.getElementById("messageText").textContent = message;
  if (title) document.getElementById("messageTitle").textContent = title;

  const scene = document.getElementById("scene");
  const startBtn = document.getElementById("startBtn");
  const hint = document.getElementById("hint");

  startBtn.addEventListener("click", () => {
    scene.classList.add("open");
    hint.textContent = "Your surprise has arrived ✨";
  });
</script>
</body>
</html>
