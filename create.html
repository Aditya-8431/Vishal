<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Gift Link</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#171923;
  background:linear-gradient(145deg,#f7f7fb,#e9ebf5)
}
.card{
  width:min(92vw,560px);padding:34px;border-radius:28px;background:rgba(255,255,255,.82);
  border:1px solid rgba(255,255,255,.72);box-shadow:0 22px 70px rgba(33,36,68,.14);
  backdrop-filter:blur(18px)
}
.badge{
  display:inline-block;padding:7px 10px;border-radius:999px;background:#efedff;color:#5c4fe6;
  font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase
}
h1{margin:15px 0 8px;font-size:34px;letter-spacing:-.04em}
p{color:#6b7280;line-height:1.6}
label{display:block;margin:22px 0 8px;font-size:13px;font-weight:750}
textarea,input{
  width:100%;border:1px solid #dddfea;border-radius:14px;padding:14px 15px;font:inherit;
  background:#fff;outline:none;transition:border .2s,box-shadow .2s
}
textarea{min-height:140px;resize:vertical}
textarea:focus,input:focus{border-color:#7c73f6;box-shadow:0 0 0 4px rgba(108,99,255,.12)}
button{
  width:100%;margin-top:18px;padding:14px 20px;border:0;border-radius:999px;color:white;
  font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#6c63ff,#8b5cf6);
  box-shadow:0 10px 24px rgba(108,99,255,.28)
}
.output{margin-top:18px;padding:14px;border-radius:16px;background:#f7f6ff;display:none}
.output strong{display:block;margin-bottom:8px}
.link{font-size:13px;word-break:break-all;color:#5048c8}
.copy{background:#171923;box-shadow:none;margin-top:12px}
.small{font-size:12px;color:#8a8f9c}
</style>
</head>
<body>
<section class="card">
  <span class="badge">Gift link maker</span>
  <h1>Create a surprise link</h1>
  <p>Write your message below. The person you send the generated link to will see this exact message when they open the gift.</p>

  <label for="title">Message title</label>
  <input id="title" value="Surprise!" maxlength="60">

  <label for="message">Your message</label>
  <textarea id="message" placeholder="Write your message here..."></textarea>

  <button id="generate">Generate Share Link</button>

  <div class="output" id="output">
    <strong>Your link</strong>
    <div class="link" id="link"></div>
    <button class="copy" id="copy">Copy Link</button>
    <div class="small" id="status"></div>
  </div>
</section>

<script>
  const messageEl = document.getElementById("message");
  const titleEl = document.getElementById("title");
  const output = document.getElementById("output");
  const linkEl = document.getElementById("link");
  const status = document.getElementById("status");

  document.getElementById("generate").addEventListener("click", () => {
    const message = messageEl.value.trim();
    const title = titleEl.value.trim() || "Surprise!";

    if (!message) {
      alert("Please write a message first.");
      return;
    }

    // create.html and index.html are in the same folder.
    const base = new URL("index.html", window.location.href);
    base.searchParams.set("title", title);
    base.searchParams.set("message", message);

    linkEl.textContent = base.href;
    output.style.display = "block";
    status.textContent = "";
  });

  document.getElementById("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(linkEl.textContent);
      status.textContent = "Copied! Send this link to someone.";
    } catch {
      status.textContent = "Copy failed. Select and copy the link manually.";
    }
  });
</script>
</body>
</html>
